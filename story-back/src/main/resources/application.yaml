server:
  port: 8000

spring:
  application:
    name: story

  datasource:
    url: jdbc:postgresql://${STORY_DATASOURCE_HOST}:5432/${POSTGRES_DB}
    username: story_back
    password: ${STORY_BACK_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 600000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${STORY_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    user: story_migrator
    password: ${STORY_MIGRATION_DB_PASSWORD}

  servlet:
    multipart:
      max-file-size: ${STORY_WORK_SIZE:20MB}
      max-request-size: ${STORY_WORK_SIZE:20MB}

story:
  jwt:
    secret: ${STORY_JWT_SECRET}
    expiration-access: 15m
    expiration-refresh: 1d

  admin:
    email: ${STORY_ADMIN_USERNAME:}
    password: ${STORY_ADMIN_PASSWORD:}

  bootstrap:
    admin-enabled: ${STORY_BOOTSTRAP_ADMIN_ENABLED:false}
    contests-enabled: ${STORY_BOOTSTRAP_CONTESTS_ENABLED:false}
    contests-resource: ${STORY_BOOTSTRAP_CONTESTS_RESOURCE:classpath:bootstrap/contests.json}

  cors:
    allowed-origins: ${STORY_CORS_ALLOWED_ORIGINS}

  contest:
    name-size: 255
    application-count: 2

  application:
    size: ${STORY_APPLICATION_SIZE:${STORY_WORK_SIZE:20MB}}
    name-size: 255
    count: -1
    work-count: 10

  work:
    size: ${STORY_WORK_SIZE:20MB}
    name-size: 255

  minio:
    url: http://${STORY_MINIO_HOST}:9000
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}
    bucket: ${MINIO_MC_BUCKET}
