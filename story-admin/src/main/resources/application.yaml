server:
  port: 8002

spring:
  application:
    name: story-admin
  datasource:
    url: jdbc:postgresql://${STORY_DATASOURCE_HOST}:5432/${POSTGRES_DB}
    username: story_admin
    password: ${STORY_ADMIN_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false

story:
  jwt:
    secret: ${STORY_JWT_SECRET}
    expiration-access: ${STORY_JWT_EXPIRATION_ACCESS:15m}
    expiration-refresh: ${STORY_JWT_EXPIRATION_REFRESH:1d}
  cors:
    allowed-origins: ${STORY_CORS_ALLOWED_ORIGINS}
  work:
    allowed-content-types: ${STORY_WORK_ALLOWED_CONTENT_TYPES:image/png,image/jpeg,image/jpg,image/tiff}
  minio:
    url: http://${STORY_MINIO_HOST}:9000
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}
    bucket: ${MINIO_MC_BUCKET}
