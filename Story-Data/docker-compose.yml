services:
  postgresql:
    image: postgres:16-alpine
    container_name: story-postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      STORY_MIGRATION_DB_PASSWORD: ${STORY_MIGRATION_DB_PASSWORD:?STORY_MIGRATION_DB_PASSWORD is required}
      STORY_AUTH_DB_PASSWORD: ${STORY_AUTH_DB_PASSWORD:?STORY_AUTH_DB_PASSWORD is required}
      STORY_BACK_DB_PASSWORD: ${STORY_BACK_DB_PASSWORD:?STORY_BACK_DB_PASSWORD is required}
      STORY_ADMIN_DB_PASSWORD: ${STORY_ADMIN_DB_PASSWORD:?STORY_ADMIN_DB_PASSWORD is required}
    ports: ["127.0.0.1:${STORY_POSTGRES_HOST_PORT:-5432}:5432"]
    volumes:
      - story-postgresql-volume:/var/lib/postgresql/data
      - ./services/postgresql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks: [data]

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: story-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports: ["127.0.0.1:${STORY_MINIO_API_HOST_PORT:-9000}:9000", "127.0.0.1:${STORY_MINIO_CONSOLE_HOST_PORT:-9001}:9001"]
    volumes: [story-minio-volume:/data]
    restart: always
    networks: [storage]

  minio-init:
    image: pgsty/mc:RELEASE.2026-11-09T00-00-00Z
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_MC_BUCKET: ${MINIO_MC_BUCKET:?MINIO_MC_BUCKET is required}
    entrypoint:
      - /bin/sh
      - -c
      - |
        attempt=0
        while [ "$$attempt" -lt 30 ]; do
          if mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && \
             mc mb --ignore-existing "local/$$MINIO_MC_BUCKET" >/dev/null 2>&1; then
            echo "MinIO bucket is ready: $$MINIO_MC_BUCKET"
            exit 0
          fi
          attempt=$$((attempt + 1))
          sleep 2
        done
        echo "Could not initialize MinIO bucket: $$MINIO_MC_BUCKET"
        exit 1
    networks: [storage]

  story-auth:
    build:
      context: ..
      dockerfile: story-auth/Dockerfile
    container_name: story-spring-auth
    environment:
      STORY_DATASOURCE_HOST: postgresql
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      STORY_AUTH_DB_PASSWORD: ${STORY_AUTH_DB_PASSWORD:?STORY_AUTH_DB_PASSWORD is required}
      STORY_JWT_SECRET: ${STORY_JWT_SECRET:?STORY_JWT_SECRET is required}
      STORY_COOKIE_SECURE: ${STORY_COOKIE_SECURE:?STORY_COOKIE_SECURE is required}
      STORY_COOKIE_SAME_SITE: ${STORY_COOKIE_SAME_SITE:?STORY_COOKIE_SAME_SITE is required}
      STORY_CORS_ALLOWED_ORIGINS: ${STORY_CORS_ALLOWED_ORIGINS:?STORY_CORS_ALLOWED_ORIGINS is required}
    expose: ["8001"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8001'"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgresql:
        condition: service_healthy
      story-back:
        condition: service_healthy
    restart: always
    networks: [app, data]

  story-back:
    build:
      context: ..
      dockerfile: story-back/Dockerfile
    container_name: story-spring
    environment:
      STORY_DATASOURCE_HOST: postgresql
      STORY_MINIO_HOST: minio
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      STORY_BACK_DB_PASSWORD: ${STORY_BACK_DB_PASSWORD:?STORY_BACK_DB_PASSWORD is required}
      STORY_MIGRATION_DB_PASSWORD: ${STORY_MIGRATION_DB_PASSWORD:?STORY_MIGRATION_DB_PASSWORD is required}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_MC_BUCKET: ${MINIO_MC_BUCKET:?MINIO_MC_BUCKET is required}
      STORY_JWT_SECRET: ${STORY_JWT_SECRET:?STORY_JWT_SECRET is required}
      STORY_CORS_ALLOWED_ORIGINS: ${STORY_CORS_ALLOWED_ORIGINS:?STORY_CORS_ALLOWED_ORIGINS is required}
      STORY_BOOTSTRAP_ADMIN_ENABLED: ${STORY_BOOTSTRAP_ADMIN_ENABLED:-false}
      STORY_ADMIN_USERNAME: ${STORY_ADMIN_USERNAME:-}
      STORY_ADMIN_PASSWORD: ${STORY_ADMIN_PASSWORD:-}
      STORY_BOOTSTRAP_ADMIN_FIRST_NAME: ${STORY_BOOTSTRAP_ADMIN_FIRST_NAME:-Admin}
      STORY_BOOTSTRAP_ADMIN_LAST_NAME: ${STORY_BOOTSTRAP_ADMIN_LAST_NAME:-User}
      STORY_BOOTSTRAP_ADMIN_BIRTH_DATE: ${STORY_BOOTSTRAP_ADMIN_BIRTH_DATE:-2001-11-04}
      STORY_WORK_ALLOWED_CONTENT_TYPES: ${STORY_WORK_ALLOWED_CONTENT_TYPES:-image/png,image/jpeg,image/jpg,image/tiff}
      STORY_BOOTSTRAP_CONTESTS_ENABLED: ${STORY_BOOTSTRAP_CONTESTS_ENABLED:-false}
      STORY_FLYWAY_BASELINE_ON_MIGRATE: ${STORY_FLYWAY_BASELINE_ON_MIGRATE:-false}
    expose: ["8000"]
    depends_on:
      postgresql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always
    networks: [app, data, storage]

  story-admin:
    build:
      context: ..
      dockerfile: story-admin/Dockerfile
    container_name: story-spring-admin
    environment:
      STORY_DATASOURCE_HOST: postgresql
      STORY_MINIO_HOST: minio
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      STORY_ADMIN_DB_PASSWORD: ${STORY_ADMIN_DB_PASSWORD:?STORY_ADMIN_DB_PASSWORD is required}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_MC_BUCKET: ${MINIO_MC_BUCKET:?MINIO_MC_BUCKET is required}
      STORY_JWT_SECRET: ${STORY_JWT_SECRET:?STORY_JWT_SECRET is required}
      STORY_CORS_ALLOWED_ORIGINS: ${STORY_CORS_ALLOWED_ORIGINS:?STORY_CORS_ALLOWED_ORIGINS is required}
      STORY_WORK_ALLOWED_CONTENT_TYPES: ${STORY_WORK_ALLOWED_CONTENT_TYPES:-image/png,image/jpeg,image/jpg,image/tiff}
    expose: ["8002"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8002'"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      story-back:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: always
    networks: [app, data, storage]

  frontend:
    build: ../Story-Front
    container_name: story-frontend
    ports: ["${STORY_FRONTEND_HOST_PORT:-3000}:80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/gateway/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on: [story-back, story-auth, story-admin]
    restart: always
    networks: [edge, app]

volumes:
  story-postgresql-volume:
  story-minio-volume:

networks:
  edge:
  app:
    internal: true
  data:
  storage:
