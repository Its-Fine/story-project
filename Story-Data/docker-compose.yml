services:
  postgresql:
    image: postgres:16-alpine
    container_name: story-postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      STORY_MIGRATION_DB_PASSWORD: ${STORY_MIGRATION_DB_PASSWORD:?STORY_MIGRATION_DB_PASSWORD is required}
      STORY_AUTH_DB_PASSWORD: ${STORY_AUTH_DB_PASSWORD:?STORY_AUTH_DB_PASSWORD is required}
      STORY_BACK_DB_PASSWORD: ${STORY_BACK_DB_PASSWORD:?STORY_BACK_DB_PASSWORD is required}
    ports: ["5432:5432"]
    volumes:
      - story-postgresql-volume:/var/lib/postgresql/data
      - ./services/postgresql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: story-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports: ["9000:9000", "9001:9001"]
    volumes: [story-minio-volume:/data]
    restart: always

  minio-init:
    image: pgsty/mc:RELEASE.2026-11-09T00-00-00Z
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_MC_BUCKET: ${MINIO_MC_BUCKET:?MINIO_MC_BUCKET is required}
    entrypoint:
      - /bin/sh
      - -c
      - |
        attempt=0
        while [ "$$attempt" -lt 30 ]; do
          if mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && \
             mc mb --ignore-existing "local/$$MINIO_MC_BUCKET" >/dev/null 2>&1; then
            echo "MinIO bucket is ready: $$MINIO_MC_BUCKET"
            exit 0
          fi
          attempt=$$((attempt + 1))
          sleep 2
        done
        echo "Could not initialize MinIO bucket: $$MINIO_MC_BUCKET"
        exit 1

  story-auth:
    build:
      context: ..
      dockerfile: story-auth/Dockerfile
    container_name: story-spring-auth
    environment:
      STORY_DATASOURCE_HOST: postgresql
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      STORY_AUTH_DB_PASSWORD: ${STORY_AUTH_DB_PASSWORD:?STORY_AUTH_DB_PASSWORD is required}
      STORY_JWT_SECRET: ${STORY_JWT_SECRET:?STORY_JWT_SECRET is required}
      STORY_COOKIE_SECURE: ${STORY_COOKIE_SECURE:?STORY_COOKIE_SECURE is required}
      STORY_COOKIE_SAME_SITE: ${STORY_COOKIE_SAME_SITE:?STORY_COOKIE_SAME_SITE is required}
      STORY_CORS_ALLOWED_ORIGINS: ${STORY_CORS_ALLOWED_ORIGINS:?STORY_CORS_ALLOWED_ORIGINS is required}
    ports: ["8001:8001"]
    depends_on:
      postgresql:
        condition: service_healthy
      story-back:
        condition: service_healthy
    restart: always

  story-back:
    build:
      context: ..
      dockerfile: story-back/Dockerfile
    container_name: story-spring
    environment:
      STORY_DATASOURCE_HOST: postgresql
      STORY_MINIO_HOST: minio
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      STORY_BACK_DB_PASSWORD: ${STORY_BACK_DB_PASSWORD:?STORY_BACK_DB_PASSWORD is required}
      STORY_MIGRATION_DB_PASSWORD: ${STORY_MIGRATION_DB_PASSWORD:?STORY_MIGRATION_DB_PASSWORD is required}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_MC_BUCKET: ${MINIO_MC_BUCKET:?MINIO_MC_BUCKET is required}
      STORY_JWT_SECRET: ${STORY_JWT_SECRET:?STORY_JWT_SECRET is required}
      STORY_CORS_ALLOWED_ORIGINS: ${STORY_CORS_ALLOWED_ORIGINS:?STORY_CORS_ALLOWED_ORIGINS is required}
      STORY_BOOTSTRAP_ADMIN_ENABLED: ${STORY_BOOTSTRAP_ADMIN_ENABLED:-false}
      STORY_ADMIN_USERNAME: ${STORY_ADMIN_USERNAME:-}
      STORY_ADMIN_PASSWORD: ${STORY_ADMIN_PASSWORD:-}
      STORY_BOOTSTRAP_CONTESTS_ENABLED: ${STORY_BOOTSTRAP_CONTESTS_ENABLED:-false}
      STORY_FLYWAY_BASELINE_ON_MIGRATE: ${STORY_FLYWAY_BASELINE_ON_MIGRATE:-false}
    ports: ["8000:8000"]
    depends_on:
      postgresql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  frontend:
    build: ../Story-Front
    container_name: story-frontend
    ports: ["3000:80"]
    depends_on: [story-back, story-auth]
    restart: always

volumes:
  story-postgresql-volume:
  story-minio-volume:
