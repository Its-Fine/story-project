server:
  port: 8001

spring:
  application:
    name: story-auth

  datasource:
    url: jdbc:postgresql://${STORY_DATASOURCE_HOST}:5432/${POSTGRES_DB}
    username: story_auth
    password: ${STORY_AUTH_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
      format_sql: true

story:
  jwt:
    secret: ${STORY_JWT_SECRET}
    expiration-access: ${STORY_JWT_EXPIRATION_ACCESS:15m}
    expiration-refresh: ${STORY_JWT_EXPIRATION_REFRESH:1d}
  cookie:
    secure: ${STORY_COOKIE_SECURE}
    same-site: ${STORY_COOKIE_SAME_SITE}
  cors:
    allowed-origins: ${STORY_CORS_ALLOWED_ORIGINS}
