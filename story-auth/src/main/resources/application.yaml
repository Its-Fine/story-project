server:
  port: 8001

spring:
  application:
    name: story-auth

  datasource:
    url: jdbc:postgresql://${STORY_DATASOURCE_HOST:postgresql}:5432/${POSTGRES_DB:story_db}
    username: ${POSTGRES_USER:story_user}
    password: ${POSTGRES_PASSWORD:story_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
      format_sql: true

story:
  jwt:
    secret: ${STORY_JWT_SECRET:c3RvcnktcHJvamVjdC1qd3Qtc2VjcmV0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==}
    expiration-access: ${STORY_JWT_EXPIRATION_ACCESS:15m}
    expiration-refresh: ${STORY_JWT_EXPIRATION_REFRESH:1d}
  cookie:
    secure: ${STORY_COOKIE_SECURE:false}
