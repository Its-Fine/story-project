services:
  postgres:
    image: postgres:15-alpine
    container_name: story-postgres
    environment:
      POSTGRES_DB: story
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: cr.yandex/mirror/minio/minio:latest
    container_name: story-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  story-auth:
    build: ./story-auth
    container_name: story-auth
    ports:
      - "8001:8001"
    environment:
      STORY_DATASOURCE_HOST: postgres
      POSTGRES_DB: story
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      STORY_JWT_SECRET: your-super-secret-key-for-auth-service-min-256-bits-long
    depends_on:
      postgres:
        condition: service_healthy

  story-back:
    build: ./story-back
    container_name: story-back
    ports:
      - "8000:8000"
    environment:
      STORY_DATASOURCE_HOST: postgres
      POSTGRES_DB: story
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      STORY_MINIO_HOST: minio
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_MC_BUCKET: story
      STORY_JWT_SECRET: your-super-secret-key-for-auth-service-min-256-bits-long
    depends_on:
      postgres:
        condition: service_healthy
      story-auth:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
